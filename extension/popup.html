<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>HyprFetch</title>
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="20" height="20" />
        <span>HyprFetch</span>
      </div>
      <span id="conn" class="dot off" title="daemon status"></span>
    </header>

    <div id="page" class="page-title"></div>

    <!-- video quality panel: what the daemon's engine (yt-dlp) really has -->
    <section id="videoSec" class="vsec hidden">
      <div class="vsec-head">
        <span class="vsec-title">Video formats</span>
        <button id="videoRescan" class="linkbtn" title="re-check formats">↻</button>
      </div>
      <div id="videoBody" class="vbody"></div>
    </section>

    <main id="list" class="list">
      <div class="empty" id="empty">
        No media spotted on this page yet.<br />
        <small>Videos get a ⬇ button in the page, right-click any media for “Download with HyprFetch”, or <b>alt+click</b> an image / file link. Big videos also show a full format list here.</small>
      </div>
    </main>

    <footer class="foot">
      <label class="auto-row" for="mediaButtons">
        <span class="auto-text">
          <span class="auto-title">⬇ buttons on videos</span>
          <span class="auto-sub">in-page buttons + alt+click (like IDM)</span>
        </span>
        <input type="checkbox" id="mediaButtons" class="switch" />
      </label>
      <label class="auto-row" for="autoCapture">
        <span class="auto-text">
          <span class="auto-title">Auto-capture downloads</span>
          <span class="auto-sub">send every browser download to HyprFetch</span>
        </span>
        <input type="checkbox" id="autoCapture" class="switch" />
      </label>
      <button id="openApp" class="btn primary">Open HyprFetch</button>
    </footer>

    <div id="toast" class="toast hidden"></div>
    <script src="popup.js"></script>
  </body>
</html>
