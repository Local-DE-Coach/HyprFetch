name: Stale

on:
  schedule:
    - cron: "0 0 * * *"  # daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,roadmap
          exempt-pr-labels: pinned,security,wip
          stale-issue-message: |
            This issue has been inactive for 60 days. It will be closed in 14 days
            unless there is new activity. Comment to keep it open.
          stale-pr-message: |
            This PR has been inactive for 60 days. It will be closed in 14 days
            unless there is new activity. Comment or push commits to keep it open.
          close-issue-message: Closed due to inactivity. Reopen if still relevant.
          close-pr-message: Closed due to inactivity. Reopen if still being worked on.
