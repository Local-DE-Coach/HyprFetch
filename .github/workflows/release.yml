name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist on the repo)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compilation deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libsqlite3-dev pkg-config \
            gcc-aarch64-linux-gnu \
            musl-tools

      - name: Build release
        env:
          # Cross-compiling aarch64 on the x86_64 runner: force the GNU
          # cross-toolchain for BOTH the final link and C dependencies
          # (ring, libsqlite3-sys bundled). Without these, cargo/rustc fall
          # back to the host `cc` plus rustc's self-contained lld wrappers
          # ("-B .../x86_64-unknown-linux-gnu/bin/gcc-ld -fuse-ld=lld"),
          # lld then picks the x86_64 emulation from host crt objects and
          # aborts with:
          #   rust-lld: error: --fix-cortex-a53-843419 is only supported on AArch64
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          # Prefer the workflow_dispatch `tag` input; on a tag push use the
          # pushed tag. GITHUB_REF_NAME alone is wrong for workflow_dispatch
          # (it is the branch name, e.g. "main").
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          ARCHIVE="hyprfetch-${VERSION}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE"
          cp target/${{ matrix.target }}/release/hyprfetch "$ARCHIVE/"
          cp README.md LICENSE CHANGELOG.md "$ARCHIVE/"
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          ls -la "$ARCHIVE.tar.gz" "$ARCHIVE.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: hyprfetch-${{ matrix.target }}
          path: |
            hyprfetch-*.tar.gz
            hyprfetch-*.sha256
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure
        run: ls -laR artifacts

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          # Attach artifacts to the tag the build was made for (inputs.tag on
          # workflow_dispatch, the pushed tag otherwise) — never the branch name.
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/hyprfetch-*.tar.gz
            artifacts/hyprfetch-*.sha256
