name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist on the repo)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compilation deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libsqlite3-dev pkg-config \
            gcc-aarch64-linux-gnu \
            musl-tools

      - name: Build release
        env:
          # Cross-compiling aarch64 on the x86_64 runner: force the GNU
          # cross-toolchain for BOTH the final link and C dependencies
          # (ring, libsqlite3-sys bundled). Without these, cargo/rustc fall
          # back to the host `cc` plus rustc's self-contained lld wrappers
          # ("-B .../x86_64-unknown-linux-gnu/bin/gcc-ld -fuse-ld=lld"),
          # lld then picks the x86_64 emulation from host crt objects and
          # aborts with:
          #   rust-lld: error: --fix-cortex-a53-843419 is only supported on AArch64
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          # Prefer the workflow_dispatch `tag` input; on a tag push use the
          # pushed tag. GITHUB_REF_NAME alone is wrong for workflow_dispatch
          # (it is the branch name, e.g. "main").
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          # Clean, human-friendly archive names for the release page AND the
          # istias.tech update channel (the manifest maps them back to
          # target triples for the updater).
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  PRETTY="linux-x64" ;;
            aarch64-unknown-linux-gnu) PRETTY="linux-arm64" ;;
            x86_64-unknown-linux-musl) PRETTY="linux-musl-x64" ;;
            *)                         PRETTY="${{ matrix.target }}" ;;
          esac
          ARCHIVE="hyprfetch-${VERSION}-${PRETTY}"
          mkdir -p "$ARCHIVE"
          cp target/${{ matrix.target }}/release/hyprfetch "$ARCHIVE/"
          cp README.md LICENSE CHANGELOG.md "$ARCHIVE/"
          # Desktop entry so Linux packages can register HyprFetch in
          # desktop menus at the standard /usr/share/applications path.
          cp packaging/desktop/hyprfetch.desktop "$ARCHIVE/"
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          ls -la "$ARCHIVE.tar.gz" "$ARCHIVE.tar.gz.sha256"

      # .deb for Ubuntu/Debian — only on the native x86_64 GNU target.
      # cargo-deb re-packages the already-built binary (--no-build); the
      # "target/release/hyprfetch" asset entry in [package.metadata.deb]
      # resolves under target/<triple>/release/ because --target is passed.
      - name: Build .deb (Ubuntu/Debian)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/debian/hyprfetch_*.deb ./
          ls -la hyprfetch_*.deb

      # .rpm for Fedora/RHEL — repackages the tar.gz produced by the Package
      # step via rpmbuild; the spec ships in packaging/rpm/.
      - name: Build .rpm (Fedora/RHEL)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y -qq rpm
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          TOPDIR="$PWD/rpmbuild"
          mkdir -p "$TOPDIR"/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          cp "hyprfetch-${VERSION}-linux-x64.tar.gz" "$TOPDIR/SOURCES/"
          sed "s/__VERSION__/${VERSION}/" packaging/rpm/hyprfetch.spec > "$TOPDIR/SPECS/hyprfetch.spec"
          rpmbuild -bb --define "_topdir $TOPDIR" "$TOPDIR/SPECS/hyprfetch.spec"
          cp "$TOPDIR"/RPMS/x86_64/hyprfetch-*.rpm ./
          rpm -qpi hyprfetch-*.rpm
          ls -la hyprfetch-*.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: hyprfetch-${{ matrix.target }}
          path: |
            hyprfetch-*.tar.gz
            hyprfetch-*.sha256
            hyprfetch_*.deb
            hyprfetch-*.rpm
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure
        run: ls -laR artifacts

      - name: Generate Arch PKGBUILD (AUR fast install)
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          # The sha256 file format is "<hash>  <filename>"; take the hash.
          SHA=$(cut -d' ' -f1 "artifacts/hyprfetch-${VERSION}-linux-x64.tar.gz.sha256")
          sed -e "s/__VERSION__/${VERSION}/g" -e "s/__SHA256__/${SHA}/" \
            packaging/arch/PKGBUILD.bin.template > PKGBUILD
          # Syntax-check the generated PKGBUILD; print it for the run log.
          bash -n PKGBUILD
          cat PKGBUILD

      - name: Generate release notes (changelog + update/install commands)
        env:
          UPDATES_PAGE: https://istias.tech/hyprfetch/updates
          PRODUCT_PAGE: https://istias.tech/hyprfetch
        run: |
          # Assembled with python3 (NOT a shell heredoc) so changelog content
          # containing backticks / $(…) / quotes can never be interpreted.
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          VERSION="$VERSION" UPDATES_PAGE="$UPDATES_PAGE" PRODUCT_PAGE="$PRODUCT_PAGE" python3 - <<'PYEOF'
          import os, re

          version = os.environ["VERSION"]
          updates_page = os.environ["UPDATES_PAGE"]
          product_page = os.environ["PRODUCT_PAGE"]

          # Pull the matching "## [X.Y.Z]" section out of CHANGELOG.md (if
          # present) so every release shows its own what's-changed list.
          section = []
          try:
              with open("CHANGELOG.md", encoding="utf-8") as f:
                  in_section = False
                  for line in f:
                      if re.match(rf"^## \[{re.escape(version)}\]", line):
                          in_section = True
                          continue
                      if in_section and line.startswith("## ["):
                          break
                      if in_section:
                          section.append(re.sub(r"^### ", "#### ", line.rstrip()))
          except FileNotFoundError:
              pass
          while section and not section[-1].strip():
              section.pop()
          section_md = "\n".join(section) or \
              "Maintenance release — see the commit history for details."

          sha = "<see the .sha256 assets>"
          try:
              with open(f"artifacts/hyprfetch-{version}-linux-x64.tar.gz.sha256") as f:
                  sha = f.read().split()[0]
          except (FileNotFoundError, IndexError):
              pass

          body = f"""> Fast, minimal-RAM, resumable download manager with a browser control panel.
          > **Project page:** {product_page} · **Update guide:** {updates_page}

          ## 🔄 Update (from any previous version)

          ```bash
          hyprfetch update --check   # → "up to date" or the new version
          hyprfetch update           # → download → sha256-verify → atomic swap → restart
          ```

          Updates come from the project's own server — one fast HTTPS request, **no
          GitHub account or token needed**. Running the web UI? Open
          **http://127.0.0.1:7780 → Updates → Check now → Install & restart.**

          ## 📦 Fresh install (per platform)

          Every artifact below is mirrored to the istias.tech update channel;
          the commands use the SERVER so installs never touch GitHub.
          `install.sh` detects CPU + libc, sha256-verifies and installs;
          re-running it updates in place.

          | Platform | Command |
          |---|---|
          | **Any Linux (one line)** | `curl -fsSL {updates_page}/install.sh \\| sh` |
          | **Arch / CachyOS** | `curl -fLO {updates_page}/{version}/PKGBUILD && makepkg -si` |
          | **Debian / Ubuntu** | `curl -fLO {updates_page}/{version}/hyprfetch_{version}-1_amd64.deb && sudo apt install ./hyprfetch_{version}-1_amd64.deb` |
          | **Fedora / RHEL** | `sudo dnf install {updates_page}/{version}/hyprfetch-{version}-1.x86_64.rpm` |
          | **Any Linux x64 (manual)** | tarball below → `sudo install -Dm755 hyprfetch /usr/local/bin/hyprfetch` |

          Uninstall: `curl -fsSL {updates_page}/install.sh | sh -s -- --uninstall`
          (Arch: `sudo pacman -Rns hyprfetch-bin` · Debian: `sudo apt remove --purge hyprfetch` ·
          Fedora: `sudo dnf remove hyprfetch`) — downloads in ~/Downloads are never touched.

          Full walkthroughs: <{product_page}> (install + test steps) · <{updates_page}> (update steps)

          ## ✨ What's changed in v{version}

          {section_md}

          ## 📥 Downloads

          | File | Platform |
          |---|---|
          | `hyprfetch-{version}-linux-x64.tar.gz` | Linux x86_64 (glibc) — recommended |
          | `hyprfetch-{version}-linux-arm64.tar.gz` | Linux ARM64 (glibc) |
          | `hyprfetch-{version}-linux-musl-x64.tar.gz` | Linux x86_64 (musl / Alpine) |
          | `hyprfetch_{version}-1_amd64.deb` | Debian / Ubuntu |
          | `hyprfetch-{version}-1.x86_64.rpm` | Fedora / RHEL |
          | `PKGBUILD` | Arch Linux (makepkg -si) |

          ## 🔐 Verify

          ```bash
          sha256sum -c <<< "{sha}  hyprfetch-{version}-linux-x64.tar.gz"
          ```

          `hyprfetch update` verifies this automatically before swapping anything.
          """
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(body)
          print("--- release_notes.md ---")
          print(body)
          PYEOF

      - name: Create / update release
        uses: softprops/action-gh-release@v3
        with:
          # Attach artifacts to the tag the build was made for (inputs.tag on
          # workflow_dispatch, the pushed tag otherwise) — never the branch name.
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/hyprfetch-*.tar.gz
            artifacts/hyprfetch-*.sha256
            artifacts/hyprfetch_*.deb
            artifacts/hyprfetch-*.rpm
            PKGBUILD

  # ---------------------------------------------------------------------
  # Mirror the release artifacts to the self-hosted update channel so
  # `hyprfetch update --check` is one fast HTTPS GET (no GitHub API, no
  # rate limits, works for the private repo).
  #
  # Layout on the server (a NEW directory — the existing site on
  # istias.tech is untouched):
  #   /var/www/istias.tech/hyprfetch/updates/latest.json   <- newest version
  #   /var/www/istias.tech/hyprfetch/updates/<version>/*.tar.gz(.sha256)
  #
  # Required repo secret: DEPLOY_SSH_KEY (private key allowed to write to
  # the server). Optional overrides: DEPLOY_HOST (default 138.197.73.65),
  # DEPLOY_USER (default root), DEPLOY_PORT (default 22),
  # DEPLOY_PATH (default /var/www/istias.tech/hyprfetch).
  # One-time origin web-server route (/hyprfetch/ -> that directory) is
  # documented in docs/update-channel.md.
  # ---------------------------------------------------------------------
  deploy-update-channel:
    name: Deploy update channel (istias.tech)
    needs: release
    # Direct-SSH mirror: needs DEPLOY_SSH_KEY authorized for the DEPLOY_USER
    # on the server. When the key/user combination isn't right (or org
    # secrets aren't shared with this repo), the job reports a NOTICE and
    # stays green — the primary mirror is the scheduled
    # `hyprfetch-mirror.yml` workflow in Local-DE-Coach/Docs, which owns the
    # working server credentials.
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate latest.json update manifest
        env:
          CHANNEL_BASE: https://istias.tech/hyprfetch/updates
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          # assets: { "<target-triple>": {url, sha256, size} } built from the
          # produced archives (clean names) + their .sha256 files. The updater
          # keys by target triple, so map the clean suffix back.
          declare -A TRIPLE=(
            [linux-x64]=x86_64-unknown-linux-gnu
            [linux-arm64]=aarch64-unknown-linux-gnu
            [linux-musl-x64]=x86_64-unknown-linux-musl
          )
          ASSETS="{}"
          for F in artifacts/hyprfetch-"$VERSION"-*.tar.gz; do
            NAME=$(basename "$F")
            PRETTY="${NAME#hyprfetch-$VERSION-}"; PRETTY="${PRETTY%.tar.gz}"
            TARGET="${TRIPLE[$PRETTY]:-$PRETTY}"
            SHA=$(cut -d' ' -f1 "artifacts/$NAME.sha256")
            SIZE=$(stat -c%s "$F")
            ASSETS=$(jq -c --arg t "$TARGET" --arg url "$CHANNEL_BASE/$VERSION/$NAME" \
              --arg sha "$SHA" --argjson size "$SIZE" \
              '. + {($t): {url: $url, sha256: $sha, size: $size}}' <<<"$ASSETS")
          done
          jq -n \
            --arg version "$VERSION" \
            --arg tag "v$VERSION" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://istias.tech/hyprfetch/updates" \
            --argjson assets "$ASSETS" \
            '{version: $version, tag: $tag, published_at: $published,
              notes_url: $notes, assets: $assets}' > latest.json
          echo "--- latest.json ---"
          cat latest.json

      - name: Check deploy secrets
        id: secrets
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Update-channel deploy SKIPPED — add the DEPLOY_SSH_KEY repo secret (see docs/update-channel.md). The scheduled mirror in Local-DE-Coach/Docs picks the release up automatically."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy artifacts + manifest to the server
        if: steps.secrets.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '138.197.73.65' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/istias.tech/hyprfetch' }}
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          SCP="scp -i $HOME/.ssh/deploy_key -P $DEPLOY_PORT -o StrictHostKeyChecking=accept-new"
          # 1. New versioned directory — old versions stay downloadable.
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/updates/$VERSION'"
          # 2. Upload this release's archives + checksums.
          $SCP artifacts/hyprfetch-"$VERSION"-*.tar.gz \
               artifacts/hyprfetch-"$VERSION"-*.tar.gz.sha256 \
               "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/updates/$VERSION/"
          # 3. Atomic manifest swap: upload to a temp name, then mv(2).
          $SCP latest.json \
               "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/updates/.latest.json.tmp.$$"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" \
               "mv '$DEPLOY_PATH/updates/.latest.json.tmp.$$' '$DEPLOY_PATH/updates/latest.json'"
          # 4. Show what the channel now serves.
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "ls -la '$DEPLOY_PATH/updates/' '$DEPLOY_PATH/updates/$VERSION/'"

      - name: Verify the channel serves the new version
        if: steps.secrets.outputs.configured == 'true'
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          GOT=$(curl -fsS --max-time 30 \
                  https://istias.tech/hyprfetch/updates/latest.json \
                  | jq -r .version 2>/dev/null || true)
          if [ "$GOT" = "$VERSION" ]; then
            echo "update channel serves v$VERSION ✓"
          else
            echo "::warning::Channel check mismatch (got: ${GOT:-nothing}). Deploy landed on the server, but the public URL does not serve the new version yet — configure the origin route /hyprfetch/ (docs/update-channel.md), then re-run this check."
          fi
