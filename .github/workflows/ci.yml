name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev pkg-config
      - name: Clippy (all targets)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        # MSRV is 1.85 (some deps require edition 2024, stabilized in 1.85).
        rust: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev pkg-config
      - name: Build
        run: cargo build --all-targets --all-features
      - name: Test
        run: cargo test --all-features --no-fail-fast

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    needs: test
    # Continue on audit findings — surface them but don't block PRs
    # (still needs to be reviewed manually)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv-verify:
    name: verify MSRV in Cargo.toml
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Check rust-version field exists in workspace
        run: |
          if ! grep -q "rust-version" Cargo.toml; then
            echo "::error::Workspace Cargo.toml is missing rust-version (MSRV) field"
            exit 1
          fi
          echo "MSRV field present"
